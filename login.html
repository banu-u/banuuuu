<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth & Firestore Hesap Yaratma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h3>E-posta ile Kayıt Ol</h3>
    <input type="text" id="firstName" placeholder="Ad" required>
    <input type="text" id="lastName" placeholder="Soyad" required>
    <input type="email" id="email" placeholder="E-posta" required>
    <input type="password" id="password" placeholder="Şifre (En az 6 karakter)" required> 
    <button id="btnKaydet">Kayıt Ol</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    // Firestore metotlarına doc ve setDoc eklendi
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    // 1. ADIM: Firebase Authentication modülünü ve gerekli fonksiyonları içe aktarıyoruz
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
          apiKey: "AIzaSyCqqkBi6GR9SHZ5_DaQ1kG3Tj7ECIMmr8w",
          authDomain: "test1-60eec.firebaseapp.com",
          projectId: "test1-60eec",
          storageBucket: "test1-60eec.firebasestorage.app",
          messagingSenderId: "408142749085",
          appId: "1:408142749085:web:91d222878d23eedbdfe374",
          measurementId: "G-230TL28339"
    };

    // Servisleri başlatıyoruz
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);
    // 2. ADIM: Auth servisini tanımlıyoruz
    const auth = getAuth(app);

    document.getElementById("btnKaydet").addEventListener("click", async () => {
        const ad = document.getElementById("firstName").value;
        const soyad = document.getElementById("lastName").value;
        const eposta = document.getElementById("email").value;
        const sifre = document.getElementById("password").value; // Şifre değerini alıyoruz

        if(ad === "" || soyad === "" || eposta === "" || sifre === "") {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        if(sifre.length < 6) {
            alert("Şifre en az 6 karakter olmalıdır!");
            return;
        }

        try {
            // 3. ADIM: Kullanıcıyı Firebase Authentication sistemine kaydediyoruz
            const userCredential = await createUserWithEmailAndPassword(auth, eposta, sifre);
            const user = userCredential.user; // Kaydolan kullanıcının bilgileri

            // 4. ADIM: Kullanıcının ek bilgilerini (Ad, Soyad vb.) Firestore'a kaydediyoruz.
            // addDoc yerine setDoc kullanarak doküman ID'sini kullanıcının benzersiz UID'si yapıyoruz.
            // Böylece gelecekte bu kullanıcının verilerine ulaşmak çok daha kolay olacak.
            await setDoc(doc(db, "kullanicilar", user.uid), {
                isim: ad,
                soyisim: soyad,
                email: eposta,
                kayitTarihi: new Date()
            });
            
            // Analytics olayını tetikle
            logEvent(analytics, 'sign_up', {
                method: 'email_password'
            });

            alert("Hesap başarıyla oluşturuldu! Firebase UID: " + user.uid);
            
            // Formu temizle
            document.getElementById("firstName").value = "";
            document.getElementById("lastName").value = "";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";

        } catch (error) {
            console.error("Hata oluştu: ", error);
            
            // Firebase Auth özel hata mesajlarını yakalama
            if (error.code === 'auth/email-already-in-use') {
                alert("Bu e-posta adresi zaten kullanımda!");
            } else if (error.code === 'auth/invalid-email') {
                alert("Geçersiz bir e-posta adresi girdiniz!");
            } else {
                alert("Kayıt işlemi sırasında bir hata meydana geldi: " + error.message);
            }
        }
    });
</script>

</body>
</html>
